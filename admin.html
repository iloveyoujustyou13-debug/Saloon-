<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | GLOSS & GLAM E-Salon</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Additional admin-specific styles */
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .admin-header {
            background: #2c1810;
            border-radius: 60px;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            color: white;
        }
        .logout-btn {
            background: #d97a4a;
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }
        .admin-card {
            background: white;
            border-radius: 2rem;
            padding: 1.8rem;
            margin-bottom: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
        }
        .bookings-table {
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #f0dbcf;
        }
        th {
            background: #faf0ea;
            font-weight: 700;
        }
        .delete-btn {
            background: #e25c3a;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 30px;
            cursor: pointer;
        }
        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
        }
        .admin-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .admin-field input, .admin-field select {
            padding: 10px;
            border-radius: 1rem;
            border: 1px solid #eedbcb;
        }
        .save-btn {
            background: #2c1810;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
        }
        .style-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .style-row input {
            flex: 1;
        }
        .add-style-btn {
            background: #d97a4a;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
        }
        h3, h4 {
            color: #2c1810;
            margin-bottom: 1rem;
        }
        hr {
            margin: 1.5rem 0;
            border-color: #f0dbcf;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h2>🎛️ GLOSS & GLAM · Admin Studio</h2>
            <button id="logoutBtn" class="logout-btn">🚪 Logout</button>
        </div>

        <!-- Password Protection Overlay -->
        <div id="authOverlay" class="auth-overlay">
            <div class="auth-card">
                <h3>🔐 Admin Access Required</h3>
                <p>Enter password to manage bookings & customize salon</p>
                <input type="password" id="adminPassword" placeholder="Password">
                <button id="unlockBtn">Unlock Panel</button>
                <div id="authError" class="error-msg"></div>
                <a href="index.html" style="display: block; margin-top: 1rem; color: #b45a33;">← Back to Customer Page</a>
            </div>
        </div>

        <!-- Admin Content (Hidden until authentication) -->
        <div id="adminContent" style="display: none;">
            <!-- Bookings Management -->
            <div class="admin-card">
                <h3>📋 Customer Pre-Bookings</h3>
                <div class="bookings-table">
                    <table id="bookingsTable">
                        <thead>
                            <tr><th>ID</th><th>Customer</th><th>Email</th><th>Date & Time</th><th>Style</th><th>Price</th><th>Actions</th>
                        </thead>
                        <tbody id="bookingsTableBody">
                            <tr><td colspan="7">Loading bookings...</td></tr>
                        </tbody>
                    </table>
                </div>
                <button id="refreshBookings" class="save-btn" style="background:#d97a4a; margin-top:1rem;">⟳ Refresh</button>
            </div>

            <!-- Front Page Customization -->
            <div class="admin-card">
                <h3>🎨 Customize Front Page</h3>
                <div class="admin-grid">
                    <div class="admin-field">
                        <label>🏷️ Hero Title</label>
                        <input type="text" id="heroTitle" placeholder="Main headline">
                    </div>
                    <div class="admin-field">
                        <label>📝 Hero Subtext</label>
                        <input type="text" id="heroSub" placeholder="Tagline">
                    </div>
                    <div class="admin-field">
                        <label>🎨 Accent Color</label>
                        <input type="color" id="accentColor" value="#d97a4a">
                    </div>
                    <div class="admin-field">
                        <label>📦 Background Start</label>
                        <input type="color" id="bgStart" value="#fef5f0">
                    </div>
                    <div class="admin-field">
                        <label>📦 Background End</label>
                        <input type="color" id="bgEnd" value="#ffe8e0">
                    </div>
                </div>
                
                <hr>
                
                <h4>✂️ Manage Hairstyles (Name, Price, Emoji)</h4>
                <div id="hairstyleList"></div>
                <button id="addHairstyleBtn" class="add-style-btn">+ Add New Style</button>
                
                <button id="saveSettingsBtn" class="save-btn">💾 Save All Customizations</button>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
